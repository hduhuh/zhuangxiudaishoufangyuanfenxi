name: Ziwo GitHub Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  governance:
    name: ziwo-delivery-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package, task, changed scope and documentation
        run: python control-center/github-sync-v1/checks.py --event "$GITHUB_EVENT_PATH"
      - name: Test delivery failure handling
        run: python -m unittest discover -s control-center/github-sync-v1/tests -v
